name: Economic calendar

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download this week's calendar
        run: |
          mkdir -p data
          if curl -sf -A "Mozilla/5.0" https://nfs.faireconomy.media/ff_calendar_thisweek.json -o /tmp/cal.json \
             && python3 -c "import json,sys; d=json.load(open('/tmp/cal.json')); sys.exit(0 if isinstance(d,list) and d else 1)"; then
            cp /tmp/cal.json data/calendar.json
            echo "Saved $(python3 -c "import json;print(len(json.load(open('data/calendar.json'))))") events"
          else
            echo "Calendar download failed, keeping the previous file"
          fi
      - name: Commit if changed
        run: |
          git config user.name "calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data || true
          git diff --cached --quiet || git commit -m "Update economic calendar"
          git push

